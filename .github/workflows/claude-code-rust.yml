name: vvdec wasm build

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
    paths:
      - '**/claude-code-rust.yml'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: claude_code_rs
  
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lorryjovens-hub/claude-code-rust

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建 Release 版本
        run: cargo build --release && ls -al target/release
          
      - uses: actions/upload-artifact@v7
        name: Upload the artifact
        with:
          name: ${{ matrix.os }}-binary
          path: target/release/${{ matrix.binary_name }}
